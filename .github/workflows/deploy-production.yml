# =============================================================================
# Deploy Production — 手动触发的生产部署（workflow_dispatch）
#
# 只允许从 MUC 长期主线 muc-main 手动触发。HUBU 尚无生产环境。
# 流程: 测试门禁 → migration 审计 → 构建并推送 GHCR(sha-<commit>) → SSH 部署
#       (记录 PREVIOUS_IMAGE → pull → up -d --no-deps sub2api → 健康检查)
#       失败自动回滚上一镜像 → 独立复核 → GHCR 旧版本清理。
# 禁止: compose down / volume rm / destructive migration / latest 部署。
# =============================================================================
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '部署原因（写入审计日志）'
        required: false
        default: 'manual deploy'
      legacy_migration_baseline:
        description: 'Legacy app SHA unknown: explicit migration-only SHA, verified against live DB checksums'
        required: false
        default: ''
      cleanup_reclaimable_docker_data:
        description: 'Prune dangling images and all build cache currently unused by builds; keeps named images, running containers, and all volumes'
        required: false
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  canonical-source:
    name: Gate — canonical MUC source
    runs-on: ubuntu-latest
    steps:
      - name: Require muc-main and exact commit
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          test "${{ github.ref }}" = "refs/heads/muc-main" || {
            echo "Production deployment is restricted to refs/heads/muc-main" >&2
            exit 1
          }
          printf '%s' "$DEPLOY_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "DEPLOY_COMMIT must be an exact 40-character Git SHA" >&2
            exit 1
          }

  # ---------------------------------------------------------------------------
  verified-ci:
    name: Reuse CI for this exact MUC commit
    runs-on: ubuntu-latest
    steps:
      - name: Require successful canonical CI without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            runs=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&per_page=30")
            state=$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.head_branch == "muc-main")] | sort_by(.id) | last | if . == null then "pending" elif .status != "completed" then "pending" else .conclusion end')
            if [ "$state" = success ]; then
              echo "Reusing successful CI for exact commit $COMMIT"
              exit 0
            fi
            if [ "$state" != pending ]; then
              echo "CI did not pass: $state" >&2
              exit 1
            fi
            echo "Waiting for this commit's existing CI ($attempt/40)"
            sleep 15
          done
          echo "No successful CI for this exact commit; deployment stopped" >&2
          exit 1

  # ---------------------------------------------------------------------------
  preflight:
    name: Migration audit (vs last deployed commit)
    runs-on: ubuntu-latest
    environment: production
    needs: [canonical-source, verified-ci]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify safe Docker cleanup scope
        run: bash scripts/prune-reclaimable-docker-test.sh

      - name: Setup SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PROD_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read last deployed commit from server
        id: state
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          LEGACY_BASELINE: ${{ inputs.legacy_migration_baseline }}
        run: |
          set -euo pipefail
          mkdir -p migration-proof
          : > migration-proof/image.txt
          : > migration-proof/ledger.txt
          prev=$(ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "sudo sh -c 'if test -f /srv/sub2api/.env.deploy; then sed -n \"s/^DEPLOY_COMMIT=//p\" /srv/sub2api/.env.deploy; fi'")
          if printf '%s' "$prev" | grep -Eq '^[0-9a-f]{40}$'; then
            git cat-file -e "$prev^{commit}"
          else
            test -z "$prev" || test "$prev" = unknown || { echo 'Invalid legacy state'; exit 1; }
            printf '%s' "$LEGACY_BASELINE" | grep -Eq '^[0-9a-f]{40}$' || {
              echo 'Unknown deployed app SHA: supply an explicit migration-only baseline'; exit 1;
            }
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "sudo bash -s" \
              < scripts/production-migration-ledger.sh > migration-ledger.tsv
            python3 scripts/verify-migration-ledger.py "$LEGACY_BASELINE" migration-ledger.tsv
            image=$(ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "sudo docker inspect sub2api --format '{{.Image}}'")
            printf '%s' "$image" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s\n' "$image" > migration-proof/image.txt
            sha256sum migration-ledger.tsv | cut -d' ' -f1 > migration-proof/ledger.txt
            prev="$LEGACY_BASELINE"
          fi
          echo "Migration baseline: $prev (does not replace unknown legacy app provenance)"
          echo "previous_commit=$prev" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$prev" > migration-proof/baseline.txt

      - name: Migration audit
        run: |
          python3 -m unittest discover -s scripts -p test_verify_migration_ledger.py
          bash scripts/audit-migrations.sh "${{ steps.state.outputs.previous_commit }}" "${{ github.sha }}"

      # Only generated non-credential digests and a Git SHA, never DB rows or env files.
      # Job-output secret heuristics can suppress arbitrary hashes; artifacts preserve
      # the exact audited bytes for the same run's deployment recheck.
      - name: Preserve verified migration proof
        uses: actions/upload-artifact@v7
        with:
          name: migration-proof
          path: migration-proof/*.txt
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v6

      - name: Download verified migration baseline
        uses: actions/download-artifact@v8
        with:
          name: migration-proof
          path: migration-proof

      - name: Compute image name (lowercase)
        id: image
        run: |
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo_lc}/sub2api" >> "$GITHUB_OUTPUT"

      - name: Compute immutable release metadata
        id: metadata
        run: |
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$timestamp" > build-timestamp.txt
          echo "version=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          baseline=$(cat migration-proof/baseline.txt)
          printf '%s' "$baseline" | grep -Eq '^[0-9a-f]{40}$'
          echo "migration_baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (sha-<commit> + production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:production
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.metadata.outputs.build_timestamp }}
            BRAND=muc
            MIGRATION_BASELINE=${{ steps.metadata.outputs.migration_baseline }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preserve immutable build timestamp
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata
          path: build-timestamp.txt
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production (with auto-rollback)
    runs-on: ubuntu-latest
    environment: production
    needs: [preflight, build-push]
    steps:
      - uses: actions/checkout@v6

      - name: Download this run's migration proof
        uses: actions/download-artifact@v8
        with:
          name: migration-proof
          path: migration-proof

      - name: Download this run's build timestamp
        uses: actions/download-artifact@v8
        with:
          name: build-metadata
          path: build-metadata

      - name: Setup SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PROD_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload deploy scripts
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "mkdir -p /tmp/sub2api-deploy"
          for f in production-deploy.sh production-healthcheck.sh production-rollback.sh production-migration-ledger.sh prune-reclaimable-docker.sh; do
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
              "cat > /tmp/sub2api-deploy/$f && chmod 700 /tmp/sub2api-deploy/$f" < "scripts/$f"
          done

      - name: Stage GHCR pull token (temp file, 600, server-side auto-delete)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先使用最小权限 read-only PAT；未配置时退回本次运行的临时 GITHUB_TOKEN。
          # secret 只进 env 与 600 临时文件，绝不写入 output/日志/命令行。
          if [ -n "$GHCR_PULL_TOKEN" ]; then token="$GHCR_PULL_TOKEN"; else token="$GITHUB_TOKEN"; fi
          printf '%s' "$token" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "umask 077; cat > /tmp/sub2api-deploy/.ghcr-token"

      - name: Run production deploy
        id: deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          CLEANUP_RECLAIMABLE_DOCKER_DATA: ${{ inputs.cleanup_reclaimable_docker_data }}
        run: |
          proof_image=$(cat migration-proof/image.txt)
          proof_ledger=$(cat migration-proof/ledger.txt)
          migration_baseline=$(cat migration-proof/baseline.txt)
          build_timestamp=$(cat build-metadata/build-timestamp.txt)
          printf '%s' "$migration_baseline" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$build_timestamp" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          image="ghcr.io/${GITHUB_REPOSITORY,,}/sub2api"
          if [ -n "$proof_image$proof_ledger" ]; then
            printf '%s' "$proof_image" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s' "$proof_ledger" | grep -Eq '^[0-9a-f]{64}$'
          fi
          set +e
          cleanup_arg=""
          if [ "$CLEANUP_RECLAIMABLE_DOCKER_DATA" = "true" ]; then
            cleanup_arg="--cleanup-reclaimable-docker-data"
          fi
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "sudo bash /tmp/sub2api-deploy/production-deploy.sh \
               $cleanup_arg \
               --image '$image:sha-${{ github.sha }}' \
               --commit '${{ github.sha }}' \
               --version 'sha-${{ github.sha }}' \
               --build-timestamp '$build_timestamp' \
               --migration-baseline '$migration_baseline' \
               --brand 'muc' \
               --expected-legacy-image '$proof_image' \
               --expected-legacy-ledger '$proof_ledger' \
               --token-file /tmp/sub2api-deploy/.ghcr-token \
               --ghcr-user '${{ github.repository_owner }}'"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Interpret deploy result
        run: |
          case "${{ steps.deploy.outputs.exit_code }}" in
            0) echo "DEPLOY OK" ;;
            1) echo "DEPLOYMENT FAILED"; echo "ROLLBACK SUCCESSFUL — 生产已恢复上一镜像"; exit 1 ;;
            2) echo "CRITICAL: ROLLBACK FAILED — 生产可能停留在坏版本，立即人工介入"; exit 1 ;;
            3) echo "PREDEPLOY CHECK FAILED — 应用容器未切换；详情见预检日志"; exit 1 ;;
            4) echo "PREDEPLOY CLEANUP FAILED — 应用容器未切换；可回收缓存可能已部分清理"; exit 1 ;;
            *) echo "UNKNOWN EXIT CODE: ${{ steps.deploy.outputs.exit_code }}"; exit 1 ;;
          esac

      - name: Independent post-deploy healthcheck
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "sudo bash /tmp/sub2api-deploy/production-healthcheck.sh --expect-commit '${{ github.sha }}' --retries 6 --interval 5"

      - name: External URL check (admin.wuxuexi.top，网络原因失败仅告警不回滚)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://admin.wuxuexi.top/healthz || true)
            echo "try $i: /healthz -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::warning::外网访问 /healthz 非 200（服务器本地健康检查已通过）。请人工确认网络链路。"

      - name: Cleanup remote temp
        if: always()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "rm -rf /tmp/sub2api-deploy" || true

  # ---------------------------------------------------------------------------
  cleanup-ghcr:
    name: Prune old GHCR versions (keep latest 3)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()
    steps:
      - name: Delete old sha- tagged versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 镜像 ghcr.io/<owner>/sub2api/sub2api 对应嵌套包名 "sub2api/sub2api"
          pkg="sub2api%2Fsub2api"
          list_versions() {
            gh api "/user/packages/container/$pkg/versions" --paginate \
              -q '.[] | "\(.id)\t\(.metadata.container.tags // [] | join(","))"' 2>/dev/null || \
            gh api "/users/${{ github.repository_owner }}/packages/container/$pkg/versions" --paginate \
              -q '.[] | "\(.id)\t\(.metadata.container.tags // [] | join(","))"' 2>/dev/null || true
          }
          versions=$(list_versions)
          if [ -z "$versions" ]; then
            echo "未找到包版本列表（首次部署或包名与预期不同），跳过清理"
            exit 0
          fi
          count=0
          while IFS=$'\t' read -r id tags; do
            [ -n "$id" ] || continue
            case "$tags" in *production*) keep="yes" ;; *) keep="no" ;; esac
            count=$((count + 1))
            if [ "$keep" = "no" ] && [ "$count" -gt 3 ]; then
              echo "deleting version $id (tags: $tags)"
              gh api -X DELETE "/user/packages/container/$pkg/versions/$id" || true
            fi
          done <<< "$versions"
