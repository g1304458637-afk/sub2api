# CI — 本仓库自有的质量门禁（上游 backend-ci.yml 之外的补充）。
# 生产部署复用同一提交的成功结果；各组件仅在输入变更时运行检查。
# 此工作流绝不执行任何真实部署。
name: CI

on:
  push:
    branches: [muc-main, hubu-main, feat/dual-window-quota, feat/hubu-dual-window-quota]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sub2api

jobs:
  changes:
    name: Determine changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      build: ${{ steps.scope.outputs.build }}
      operations: ${{ steps.scope.outputs.operations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select checks for changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/ci-scope.py

  frontend:
    needs: [changes, operations]
    if: always()
    name: Frontend lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection and related checks
        run: |
          test '${{ needs.changes.result }}' = success
          test '${{ needs.operations.result }}' = success
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@v6

      - if: needs.changes.outputs.frontend == 'true'
        name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - if: needs.changes.outputs.frontend == 'true'
        name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - if: needs.changes.outputs.frontend == 'true'
        name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - if: needs.changes.outputs.frontend == 'true'
        name: Lint
        working-directory: frontend
        run: pnpm run lint:check

      - if: needs.changes.outputs.frontend == 'true'
        name: i18n key completeness
        working-directory: frontend
        run: pnpm run check:i18n

      - if: needs.changes.outputs.frontend == 'true'
        name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - if: needs.changes.outputs.frontend == 'true'
        name: Critical tests (upstream gate - make test-frontend-critical)
        run: make test-frontend-critical

  backend:
    needs: [changes, operations]
    if: always()
    name: Backend unit / integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection and related checks
        run: |
          test '${{ needs.changes.result }}' = success
          test '${{ needs.operations.result }}' = success
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v6

      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - if: needs.changes.outputs.backend == 'true'
        name: Unit tests
        working-directory: backend
        run: make test-unit

      - if: needs.changes.outputs.backend == 'true'
        name: Integration tests
        working-directory: backend
        run: make test-integration

  build-test:
    name: Docker build test (no push)
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend]
    if: always()
    steps:
      - name: Require successful prerequisite checks
        run: |
          test '${{ needs.changes.result }}' = success
          test '${{ needs.frontend.result }}' = success
          test '${{ needs.backend.result }}' = success
      - if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@v6

      - if: needs.changes.outputs.build == 'true'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只验证生产 Dockerfile 可构建，不推送任何镜像。
      - if: needs.changes.outputs.build == 'true'
        name: Build image (load only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-test
          build-args: |
            VERSION=ci-test
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  operations:
    name: Deployment and CI checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: needs.changes.outputs.operations == 'true'
        name: Shell syntax and migration/scope regression tests
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - if: needs.changes.outputs.operations == 'true'
        name: Validate workflow syntax and expressions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color .github/workflows/ci.yml .github/workflows/backend-ci.yml .github/workflows/deploy-production.yml
