# CI — 本仓库自有的质量门禁（上游 backend-ci.yml 之外的补充）。
# 生产部署（deploy-production.yml）以此同等测试作为前置 job；
# 此工作流绝不执行任何真实部署。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sub2api

jobs:
  frontend:
    name: Frontend lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint:check

      - name: i18n key completeness
        working-directory: frontend
        run: pnpm run check:i18n

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Critical tests (upstream gate - make test-frontend-critical)
        run: make test-frontend-critical

  backend:
    name: Backend unit / integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        working-directory: backend
        run: make test-unit

      - name: Integration tests
        working-directory: backend
        run: make test-integration

  build-test:
    name: Docker build test (no push)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只验证生产 Dockerfile 可构建，不推送任何镜像。
      - name: Build image (load only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-test
          build-args: |
            VERSION=ci-test
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
